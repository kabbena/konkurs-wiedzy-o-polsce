<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8423f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Gra-quiz dla dzieci przygotowująca do Konkursu wiedzy o Polsce (klasa 1).">
<title>Wyprawa po Polsce</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='50' fill='%23fff'/%3E%3Crect y='50' width='100' height='50' fill='%23dc143c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#23324a; --muted:#6b7891; --line:#ead9c2;
  --red:#e8423f; --red-d:#b92a28; --green:#2fa65a; --green-l:#dff5e6; --orange:#f39a1e; --orange-l:#fff0d6;
  --blue:#2f8fd8; --blue-l:#e3f1fc; --gold:#f2c230; --sea:#bfe3f7; --land:#c9e8a8; --neigh:#ece6d8;
  --shadow:0 4px 0 rgba(35,50,74,.12);
  --r:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1c2333; --card:#27304a; --ink:#f3f5fb; --muted:#b4bdd2; --line:#3a4563;
  --green-l:#1f4a33; --orange-l:#4d3a17; --blue-l:#1d3a57; --sea:#2b4f6b; --land:#4f7a3f; --neigh:#3a4256;
  --shadow:0 4px 0 rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#1c2333; --card:#27304a; --ink:#f3f5fb; --muted:#b4bdd2; --line:#3a4563;
  --green-l:#1f4a33; --orange-l:#4d3a17; --blue-l:#1d3a57; --sea:#2b4f6b; --land:#4f7a3f; --neigh:#3a4256;
  --shadow:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Baloo 2","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;line-height:1.25;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.scr{flex:1;display:flex;flex-direction:column;padding:12px 16px 20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.top .grow{flex:1}
.ibtn{width:52px;height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.ibtn:active{transform:translateY(2px);box-shadow:none}
.pill{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px;font-weight:700;font-size:20px;white-space:nowrap}
.hello{font-weight:800;font-size:24px}
.speak{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 0 #1d6aa6}
.speak.on{animation:pulse 1s infinite}
.speak.sm{width:44px;height:44px;font-size:22px;box-shadow:0 3px 0 #1d6aa6}
@keyframes pulse{50%{transform:scale(1.08)}}

/* map of stations */
.trail{position:relative;margin:4px 0 10px}
.trail svg.line{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:130px}
.node .disc{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;
  border:5px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.18);position:relative}
.node .disc svg{width:56px;height:56px}
.node.locked .disc{background:#c9ccd4 !important;filter:grayscale(1);opacity:.7}
.node .lbl{font-weight:800;font-size:17px;margin-top:4px;text-align:center;line-height:1.05;background:var(--bg);border-radius:8px;padding:0 4px}
.node .stars{font-size:15px;letter-spacing:1px;color:var(--gold);min-height:18px}
.node .badge{position:absolute;top:-10px;right:-12px;font-size:26px}
.node.next .disc::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:4px solid var(--orange);animation:ring 1.4s infinite}
@keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
.footer{display:flex;justify-content:center;gap:12px;margin-top:auto;padding-top:8px}
.link{font-size:16px;color:var(--muted);text-decoration:underline;padding:10px}

/* cards & buttons */
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:10px 22px;border-radius:20px;font-weight:800;font-size:24px;
  background:var(--green);color:#fff;box-shadow:0 5px 0 #1d7a40;width:100%}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #1d7a40}
.big.alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.big.blue{background:var(--blue);box-shadow:0 5px 0 #1d6aa6}
.row{display:flex;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.learn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.learn .pic{font-size:110px;line-height:1}
.learn .pic svg{width:180px;height:auto;max-height:200px}
.learn .pic.map svg{width:100%;max-height:none}
.learn h2{margin:0;font-size:32px;font-weight:800}
.learn p{margin:0;font-size:25px;font-weight:600;line-height:1.3}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--blue)}

/* quiz */
.prog{display:flex;gap:6px;flex:1}
.prog i{flex:1;height:14px;border-radius:7px;background:var(--line);display:block}
.prog i.ok{background:var(--green)} .prog i.miss{background:var(--orange)} .prog i.cur{background:var(--blue)}
.qhead{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.qtext{font-size:28px;font-weight:800;line-height:1.15;flex:1}
.qsub{font-size:17px;color:var(--muted);font-weight:700}
.hint{display:flex;align-items:center;gap:10px;background:var(--orange-l);border-radius:18px;padding:10px 12px;font-size:21px;font-weight:700;margin-bottom:10px;animation:fade .2s}
.ans{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:4px solid transparent;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;min-height:112px;padding:10px 8px;font-weight:800;font-size:22px;text-align:center;line-height:1.1;transition:background .15s}
.opt .em{font-size:44px;line-height:1}
.opt .em svg{width:48px;height:40px}
.opt.vis{min-height:120px} .opt.vis svg{width:100%;max-width:140px;height:auto;max-height:110px}
.list .opt{flex-direction:row;justify-content:flex-start;min-height:72px;padding:10px 16px;gap:14px;text-align:left}
.list .opt .em{font-size:36px;width:44px;text-align:center}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--green-l);border-color:var(--green)}
.opt.bad{opacity:.45;border-color:var(--red);pointer-events:none}
.opt.dim{opacity:.5}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf .opt{min-height:150px;font-size:30px}
.tf .opt .em{font-size:64px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.mapbox{background:var(--sea);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.mapbox svg{display:block;width:100%;height:auto}
.dot{cursor:pointer}
.dot .c{fill:var(--orange);stroke:#fff;stroke-width:4}
.dot.ok .c{fill:var(--green)} .dot.bad .c{fill:var(--red);opacity:.5}
.dot.help .c{animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
.cty{cursor:pointer}
.cty path{fill:#ffd27a;stroke:#9a6a10;stroke-width:1.2}
.cty.ok path{fill:var(--green)} .cty.bad path{fill:var(--red);opacity:.45}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px}
.match .opt{min-height:96px}
.match .opt.sel{border-color:var(--blue);background:var(--blue-l)}
.match .opt.done{background:var(--green-l);border-color:var(--green);pointer-events:none}
.order .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:120px}
.order .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.order .slot{border:4px dashed var(--line);border-radius:20px;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:var(--muted)}
.order .slot .opt{width:100%;min-height:112px;background:var(--green-l);border-color:var(--green)}
.order .opt{min-height:112px;font-size:19px}
.order .ghost{visibility:hidden}
.help{animation:pulse 1s infinite}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheet .in{pointer-events:auto;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,0,0,.15);animation:up .25s ease}
.sheet.good .in{background:var(--green-l)} .sheet.meh .in{background:var(--orange-l)} .sheet.neu .in{background:var(--card)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{margin:0 0 6px;font-size:30px;font-weight:800}
.sheet .fact{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:600;margin-bottom:14px}
.veil{position:fixed;inset:0;background:rgba(20,28,45,.45);z-index:15;animation:fade .2s}

/* end */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.end .bigstars{font-size:64px;letter-spacing:4px}
.end .bigstars span{display:inline-block;animation:pop .5s backwards}
.end .bigstars span.off{filter:grayscale(1);opacity:.3}
@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.3)}to{transform:scale(1)}}
.end h2{margin:0;font-size:36px;font-weight:800}
.end .stk{font-size:96px;line-height:1;animation:pop .6s .6s backwards}
.end p{margin:0;font-size:22px;font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* album */
.album{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.album .cell{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 8px;text-align:center;border:4px solid transparent}
.album .cell .e{font-size:64px;line-height:1.1}
.album .cell.no .e{filter:grayscale(1);opacity:.25}
.album .cell.gold{border-color:var(--gold)}
.album .cell .n{font-weight:800;font-size:18px}
.album .cell .s{font-size:15px;color:var(--muted);font-weight:700}

/* parent */
.par h2{margin:6px 0 10px;font-size:26px}
.par .st{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.par .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.par .bar b{display:block;height:100%;background:var(--green)}
.par .small{font-size:16px;color:var(--muted)}
.par .wr{font-size:16px;margin:4px 0 0 4px}
.tog{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;font-size:18px;font-weight:700;box-shadow:var(--shadow);width:100%;text-align:left}
.tog b{background:var(--line);border-radius:999px;padding:2px 12px;font-size:16px}
.tog b.on{background:var(--green);color:#fff}
.danger{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.gate{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}

/* diploma */
.dip{border:8px double var(--gold);border-radius:24px;background:#fffdf5;color:#3a2a10;padding:24px 16px;text-align:center;margin:10px 0}
.dip h1{margin:0;font-size:44px;letter-spacing:4px;color:var(--red)}
.dip .who{font-size:42px;font-weight:800;margin:8px 0}
.dip p{margin:6px 0;font-size:20px;font-weight:700}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:18px;z-index:40;animation:fade .2s;max-width:90vw;text-align:center}
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.intro .logo svg{width:150px;height:auto}
.intro h1{margin:0;font-size:38px;font-weight:800}
.intro p{margin:0;font-size:24px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.namebox{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.namebox label{font-size:22px;font-weight:800}
.namebox input{font:inherit;font-size:28px;font-weight:800;color:var(--ink);background:var(--card);border:4px solid var(--line);border-radius:18px;padding:10px 16px;width:100%;user-select:text;-webkit-user-select:text}
.namebox input:focus{outline:none;border-color:var(--blue)}
.sexrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sexrow .opt{min-height:92px;font-size:20px}
.sexrow .opt.sel{border-color:var(--blue);background:var(--blue-l)}
.err{color:var(--red);font-weight:800;font-size:18px;min-height:22px}
.intro{gap:12px}
.intro .logo svg{width:84px}
.intro h1{font-size:32px}
.intro p{font-size:20px}
.intro .qsub{font-size:15px}
.intro .logo svg{width:70px}
.sexrow .opt{min-height:84px}
.lvtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 2px}
.lvtab{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:8px 4px;font-weight:800;font-size:16px;border:3px solid transparent;white-space:nowrap}
.lvtab.on.l1{border-color:#c07a3a;background:#f7e2cc;color:#5a3412}
.lvtab.on.l2{border-color:#8a96a8;background:#e6eaf0;color:#2f3a4c}
.lvtab.on.l3{border-color:#d4a017;background:#fff1c2;color:#5a4300}
.lvtab.locked{opacity:.55}
.lvh{margin:18px 0 6px;font-size:22px;font-weight:800}
.album{grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.album .cell{padding:8px 2px;border-radius:16px}
.album .cell .e{font-size:38px}
.album .cell .n{font-size:12px;line-height:1.05;min-height:26px}
.album .cell .s{font-size:12px}
.dip .lvd{font-size:24px;font-weight:800}
.match .opt .mx{font-size:16px;line-height:1.1}
.lvtab{display:flex;flex-direction:column;align-items:center;gap:0;font-size:14px;line-height:1.1;padding:6px 2px;min-width:0}
.lvtab .md{font-size:20px}
.order .tiles,.order .slots{grid-template-columns:repeat(3,minmax(0,1fr))}
.order .opt{font-size:16px;overflow-wrap:anywhere;hyphens:auto;padding:8px 4px}
.grid,.match,.tf{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-width:0;overflow-wrap:anywhere}
.opt{overflow-wrap:normal;hyphens:manual}
.order .opt{overflow-wrap:normal;hyphens:manual;font-size:clamp(12px,3.7vw,17px);padding:8px 3px}
.match .opt{font-size:clamp(15px,5vw,22px);padding:8px 4px}
.match .opt .mx{font-size:clamp(13px,4.2vw,16px)}
.grid .opt{font-size:clamp(16px,5.4vw,22px)}
.list .opt{font-size:clamp(17px,5.6vw,22px)}

</style>
</head>
<body>
<div id="app"></div>

/* ---------------- state ---------------- */
function fresh() { return { v: 1, stars: 0, st: {}, fin: { best: 0, done: 0, pending: null }, cur: { scr: 'intro' }, sfx: true, all: false, lv: 1, fins: {} }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) { } return null; }
let S = load() || fresh();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function stS(id) { return S.st[id] || (S.st[id] = { rounds: 0, best: 0, known: [], wrong: [], seen: [], learned: false, pending: null }); }
const isFin = k => BASE(k) === 'fin';
function finS(k) { const lv = LV(k); if (lv === 1) return S.fin; S.fins = S.fins || {}; return S.fins[lv] || (S.fins[lv] = { best: 0, done: 0, pending: null }); }
const roundOf = sid => isFin(sid) ? finS(sid).pending : stS(sid).pending;
const setRound = (sid, r) => { if (isFin(sid)) finS(sid).pending = r; else stS(sid).pending = r; };
const lvUnlocked = lv => lv === 1 || S.all || finS(kk('fin', lv - 1)).done > 0;
const unlocked = (i, lv) => lvUnlocked(lv) && (S.all || i === 0 || stS(kk(STATIONS[i - 1].id, lv)).rounds > 0);
const finalUnlocked = lv => lvUnlocked(lv) && (S.all || STATIONS.every(s => stS(kk(s.id, lv)).rounds > 0));
const mastered = sid => { const s = stById(sid); return s.q.every(q => stS(sid).known.includes(q.id)); };
function nextSid(lv) {
  if (!lvUnlocked(lv)) return null;
  for (const s of STATIONS) if (stS(kk(s.id, lv)).pending) return kk(s.id, lv);
  for (let i = 0; i < STATIONS.length; i++) if (unlocked(i, lv) && stS(kk(STATIONS[i].id, lv)).rounds === 0) return kk(STATIONS[i].id, lv);
  if (finalUnlocked(lv) && !finS(kk('fin', lv)).done) return kk('fin', lv);
  return null;
}

/* ---------------- round building ---------------- */
function buildList(qs, st, n) {
  const W = shuffle(qs.filter(q => st.wrong.includes(q.id)));
  const U = shuffle(qs.filter(q => !st.seen.includes(q.id) && !st.wrong.includes(q.id)));
  const N = shuffle(qs.filter(q => st.seen.includes(q.id) && !st.known.includes(q.id) && !st.wrong.includes(q.id)));
  const K = shuffle(qs.filter(q => st.known.includes(q.id) && !st.wrong.includes(q.id)));
  const order = [...W.slice(0, 2), ...U, ...N, ...W.slice(2), ...K];
  const out = [], later = [], cnt = {};
  const lim = t => t === 'choice' ? 3 : (t === 'tf' ? 2 : 1);
  for (const q of order) {
    if (out.length >= n) break;
    if ((cnt[q.t] || 0) < lim(q.t)) { out.push(q); cnt[q.t] = (cnt[q.t] || 0) + 1; } else later.push(q);
  }
  for (const q of later) { if (out.length >= n) break; out.push(q); }
  return shuffle(out).map(q => q.id);
}
function newRound(sid) {
  let ids;
  if (isFin(sid)) {
    const sts = lvStations(LV(sid));
    ids = [];
    sts.forEach(s => ids.push(buildList(s.q, stS(s.id), 1)[0]));
    const rest = shuffle(sts.flatMap(s => s.q).filter(q => !ids.includes(q.id) && q.t !== 'order'));
    ids = shuffle(ids.concat(rest.slice(0, FINAL_N - ids.length).map(q => q.id)));
  } else ids = buildList(stById(sid).q, stS(sid), ROUND);
  const r = { sid, ids, i: 0, res: [], miss: false, solved: false };
  setRound(sid, r); return r;
}

    <p class="qsub" style="text-align:center;margin:10px 0 0">Dotykaj po kolei: co było pierwsze? 👆</p></div>`;
  let n = 0;
  ans.querySelectorAll('.tiles .opt').forEach(b => b.onclick = () => {
    if (Q.done || b.classList.contains('ghost')) return;
    if (+b.dataset.k === n) {
      const slot = ans.querySelector(`.slot[data-i="${n}"]`);
      slot.innerHTML = `<div class="opt">${b.innerHTML}</div>`; b.classList.add('ghost'); b.classList.remove('help');
      n++; beep(n < items.length ? 'tap' : 'ok');
      if (n === items.length) solve(Q.mistakes === 0, true);
      else if (Q.mistakes >= 2) { const nx = ans.querySelector(`.tiles .opt[data-k="${n}"]`); if (nx) nx.classList.add('help'); }
    } else {
      beep('bad'); b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 450); markMiss();
      if (Q.mistakes >= 2) { const nx = ans.querySelector(`.tiles .opt[data-k="${n}"]`); if (nx) nx.classList.add('help'); showHint('Pomogę Ci! Mrugający obrazek jest następny.'); }
      else showHint('Pomyśl, co było najpierw.');
    }
  });
  return q.q + ': ' + items.map(o => o.say).join(', ');
}

const PRAISE = ['Brawo', 'Super', 'Świetnie', 'Ekstra', 'Wspaniale', 'Doskonale', 'Mistrzowsko'];
function solve(firstOk, silent) {
  if (Q.done) return; Q.done = true;
  const { q, r, sid } = Q;
  const ok = firstOk && Q.mistakes === 0;
  r.res[r.i] = ok; r.solved = true;
  const home = QMAP[q.id].sid, st = stS(home);
  if (!st.seen.includes(q.id)) st.seen.push(q.id);
  if (ok) { if (!st.known.includes(q.id)) st.known.push(q.id); st.wrong = st.wrong.filter(x => x !== q.id); }
  else { st.known = st.known.filter(x => x !== q.id); if (!st.wrong.includes(q.id)) st.wrong.push(q.id); }
  save();
  if (!silent || firstOk) beep(firstOk ? 'ok' : 'bad');
  const solvedRight = firstOk || q.t === 'match' || q.t === 'order';
  const title = ok ? `${pick(PRAISE)}, ${nm()}! 🎉` : solvedRight ? 'Udało się! 💪' : 'Nic nie szkodzi! 💪';
  const pre = ok || solvedRight ? '' : 'Dobra odpowiedź świeci na zielono. ';
  const d = sheet(ok ? 'good' : 'meh', `<h3>${title}</h3><div class="fact">${spk('sm')}<span>${esc(q.f || '')}</span></div>
     <button class="big" id="next">Dalej ▶</button>`);
  bindSpeak(d, (ok ? title : pre) + ' ' + (q.f || ''));
  d.querySelector('#next').onclick = () => { beep('tap'); go({ scr: 'quiz', sid }); };
}
function finishRound(sid) {
  const r = roundOf(sid), n = r.ids.length, good = r.res.filter(Boolean).length, isF = isFin(sid);
  const stars = isF ? (good >= 9 ? 3 : good >= 6 ? 2 : 1) : (good === n ? 3 : good >= 3 ? 2 : 1);
  let first = false, gold = false;
  if (isF) { const f = finS(sid); first = f.done === 0; f.done++; f.best = Math.max(f.best, stars); f.pending = null; }
  else { const st = stS(sid); const wasGold = mastered(sid); first = st.rounds === 0; st.rounds++; st.best = Math.max(st.best, stars); st.pending = null; gold = !wasGold && mastered(sid); }
  S.stars += stars;
  go({ scr: 'end', sid, stars, good, n, first, gold });
}
function rEnd(c) {
  const s = stById(c.sid), isF = isFin(c.sid), lv = LV(c.sid), newLv = isF && c.first && lv < 3;
  let msg = c.gold ? `Złota korona! Umiesz cały przystanek „${s.name}”! 👑` : c.first ? (isF ? g('Zdobyłeś Puchar Mistrza!', 'Zdobyłaś Puchar Mistrzyni!') : 'Nowa naklejka w albumie!') : `Dobre odpowiedzi: ${c.good} z ${c.n}`;
  if (newLv) msg += ` Otwiera się Poziom ${lv + 1}! ${LVMEDAL[lv + 1]}`;
  const el = screen(`<div class="end"><h2>${c.stars === 3 ? 'Wspaniale' : c.stars === 2 ? 'Brawo' : 'Dobra robota'}, ${nm()}!</h2>
    <div class="bigstars">${[0, 1, 2].map(k => `<span class="${k < c.stars ? '' : 'off'}" style="animation-delay:${k * 0.25}s">⭐</span>`).join('')}</div>
    ${c.first || c.gold ? `<div class="stk">${c.gold ? '👑' : s.sticker}</div>` : ''}
    <div class="row" style="align-items:center"><p>${esc(msg)}</p>${spk('sm')}</div>
    <div class="list" style="width:100%;margin-top:10px">
      ${newLv ? `<button class="big" id="nextlv">${LVMEDAL[lv + 1]} Poziom ${lv + 1} ▶</button>` : ''}
      ${isF ? '<button class="big blue" id="dip">📜 Mój dyplom</button>' : ''}
      <button class="big ${isF ? 'alt' : ''}" id="map">🗺️ Mapa</button><button class="big alt" id="again">🔁 Jeszcze raz</button></div></div>`);
  bindSpeak(el, `${c.stars} gwiazdki. ${msg}`.replace('1 gwiazdki', 'Jedna gwiazdka').replace('3 gwiazdki', 'Trzy gwiazdki').replace('2 gwiazdki', 'Dwie gwiazdki'));
  el.querySelector('#map').onclick = () => go({ scr: 'map' });
  el.querySelector('#again').onclick = () => startQuiz(c.sid);
  const dp = el.querySelector('#dip'); if (dp) dp.onclick = () => go({ scr: 'diploma', lv });
  const nl = el.querySelector('#nextlv'); if (nl) nl.onclick = () => { S.lv = lv + 1; go({ scr: 'map' }); };
  beep('win'); confetti(c.stars * 25);
}
function confetti(n) {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#e8423f', '#ffffff', '#f2c230', '#2fa65a', '#2f8fd8', '#c0479a'];
  for (let i = 0; i < n; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = pick(cols); p.style.animationDuration = 1.8 + Math.random() * 1.8 + 's'; p.style.animationDelay = Math.random() * 0.6 + 's'; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4500);
}

/* ---------------- album, diploma ---------------- */
function rAlbum() {
  const secs = LVN.map(lv => {
    if (!lvUnlocked(lv)) return `<h2 class="lvh">🔒 Poziom ${lv}</h2><p class="qsub" style="margin:0">Otworzy się po Wielkim Finale poziomu ${lv - 1}.</p>`;
    const cells = [...lvStations(lv), stById(kk('fin', lv))].map(s => {
      const isF = isFin(s.id), st = isF ? finS(s.id) : stS(s.id), has = isF ? st.done > 0 : st.rounds > 0, gold = isF ? st.best === 3 : mastered(s.id);
      return `<div class="cell ${has ? '' : 'no'} ${has && gold ? 'gold' : ''}"><div class="e">${has ? s.sticker : '❔'}</div><div class="n">${esc(s.name)}</div><div class="s">${has ? (gold ? '👑' : '★'.repeat(st.best)) : '–'}</div></div>`;
    }).join('');
    const dip = finS(kk('fin', lv)).done ? `<button class="big blue dipbtn" data-lv="${lv}" style="margin-top:10px">📜 Dyplom – poziom ${lv}</button>` : '';
    return `<h2 class="lvh">${LVMEDAL[lv]} Poziom ${lv}</h2><div class="album">${cells}</div>${dip}`;
  }).join('');
  const el = screen(`<div class="top"><button class="ibtn" id="home" aria-label="Mapa">🏠</button><span class="hello grow" style="white-space:nowrap">📒 Naklejki</span><span class="pill">⭐ ${S.stars}</span></div>${secs}`);
  el.querySelector('#home').onclick = () => go({ scr: 'map' });
  el.querySelectorAll('.dipbtn').forEach(b => b.onclick = () => go({ scr: 'diploma', lv: +b.dataset.lv }));
}
function rDiploma(c) {
  const lv = (c && c.lv) || 1;
  const d = new Date().toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
  const el = screen(`<div class="top"><button class="ibtn" id="home" aria-label="Mapa">🏠</button><span class="grow"></span></div>
    <div class="dip"><div style="width:110px;margin:0 auto">${emblem('pl')}</div><h1>DYPLOM</h1><p>otrzymuje</p><div class="who">${nm()}</div>
    <p>${g('Mistrz', 'Mistrzyni')} Wiedzy o Polsce 🏆</p><p class="lvd">${LVMEDAL[lv]} Poziom ${lv}</p><p>Zebrane gwiazdki: ⭐ ${S.stars}</p><p style="font-size:16px;font-weight:600">${d}</p></div>
    <div class="row" style="align-items:center;justify-content:center">${spk()}</div>`);
  bindSpeak(el, `Dyplom otrzymuje ${S.name}. ${g('Mistrz', 'Mistrzyni')} wiedzy o Polsce, poziom ${['', 'pierwszy', 'drugi', 'trzeci'][lv]}! Gratulacje!`);
  el.querySelector('#home').onclick = () => go({ scr: 'map' });
  confetti(60);
}

/* ---------------- parent ---------------- */
function resetGame() {
  const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4), ok = a * b;
  const opts = shuffle([ok, ok + a, ok - b, ok + 10]);
  const d = sheet('neu', `<h3>Nowa gra</h3><p class="qsub" style="margin:0 0 6px">Usunie imię (${nm()}) i wszystkie postępy: gwiazdki, naklejki i dyplomy ze wszystkich poziomów.</p>
    <p style="margin:0;font-weight:800">Dla rodzica: ile to ${a} × ${b}?</p><div class="gate">${opts.map(v => `<button class="big alt" data-v="${v}">${v}</button>`).join('')}</div>
    <button class="big alt" id="no" style="margin-top:12px">Anuluj</button>`, true);
  d.querySelectorAll('[data-v]').forEach(x => x.onclick = () => {
    if (+x.dataset.v !== ok) { closeSheet(); toast('Nic nie zostało usunięte 🙂'); return; }
    S = fresh(); save(); go({ scr: 'intro' }); toast('Gotowe – nowa gra');
  });
  d.querySelector('#no').onclick = closeSheet;
}
function parentGate() {
  const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4), ok = a * b;
  const opts = shuffle([ok, ok + a, ok - b, ok + 10]);
  const d = sheet('neu', `<h3>Dla rodzica</h3><p class="qsub" style="margin:0">Ile to ${a} × ${b}?</p><div class="gate">${opts.map(v => `<button class="big alt" data-v="${v}">${v}</button>`).join('')}</div>`, true);
  d.querySelectorAll('[data-v]').forEach(x => x.onclick = () => { if (+x.dataset.v === ok) go({ scr: 'parent' }); else { closeSheet(); toast('To miejsce dla rodzica 🙂'); } });
}
function rParent(c) {
  const secs = LVN.filter(lv => lvUnlocked(lv)).map(lv => {
    const rows = lvStations(lv).map(s => {
      const st = stS(s.id), k = st.known.length, n = s.q.length;
      const wr = st.wrong.map(id => QMAP[id] ? `<div class="wr">• ${esc(QMAP[id].q.q)}</div>` : '').join('');
      return `<div class="st"><b>${s.icon} ${esc(s.name)}</b> <span class="small">– umie ${k}/${n}, rund: ${st.rounds}</span><div class="bar"><b style="width:${Math.round(k / n * 100)}%"></b></div>${wr ? `<div class="small" style="margin-top:4px">Do powtórki:</div>${wr}` : ''}</div>`;
    }).join('');
    const f = finS(kk('fin', lv));
    return `<h2>${LVMEDAL[lv]} Poziom ${lv}</h2>${rows}<div class="st"><b>🏆 Wielki Finał</b> <span class="small">– rozegrany ${f.done}×, najlepiej ${f.best}/3 ★</span></div>`;
  }).join('');
  const el = screen(`<div class="top"><button class="ibtn" id="home" aria-label="Mapa">🏠</button><span class="hello grow">Panel rodzica</span></div>
    <div class="par">${secs}
    <h2>Ustawienia</h2>
    <button class="tog" id="name">Imię: ${nm()} ${S.sex === 'f' ? '👧' : '👦'} <b>Zmień</b></button>
    <button class="tog" id="sfx">Dźwięki (dzyń przy odpowiedzi) <b class="${S.sfx ? 'on' : ''}">${S.sfx ? 'WŁ' : 'WYŁ'}</b></button>
    <button class="tog" id="all">Odblokuj wszystkie przystanki i poziomy <b class="${S.all ? 'on' : ''}">${S.all ? 'WŁ' : 'WYŁ'}</b></button>
    <p class="small">Lektor: dziecko klika 🔊 przy pytaniu, karcie lub podpowiedzi. Postęp zapisuje się sam w tym telefonie i przeglądarce – po zamknięciu gra wraca do tego samego miejsca.</p>
    <p class="small">Każda runda to 5 pytań (finał: 10). Pytania z błędem wracają w następnych rundach. Złota korona 👑 = wszystkie pytania z przystanku zaliczone za pierwszym razem. Poziom 2 i 3 otwierają się po Wielkim Finale poprzedniego poziomu.</p>
    <button class="big danger" id="reset" style="margin-top:10px">Usuń imię i postępy (nowa gra)</button></div>`);
  el.querySelector('#home').onclick = () => go({ scr: 'map' });
  el.querySelector('#name').onclick = () => go({ scr: 'intro', edit: true });
  el.querySelector('#sfx').onclick = () => { S.sfx = !S.sfx; save(); render(); };
  el.querySelector('#all').onclick = () => { S.all = !S.all; save(); render(); };
  el.querySelector('#reset').onclick = () => {
    const d = sheet('neu', `<h3>Na pewno?</h3><p class="qsub">Imię oraz wszystkie gwiazdki, naklejki i dyplomy zostaną usunięte.</p><div class="list"><button class="big danger" id="yes">Tak, usuń</button><button class="big alt" id="no">Anuluj</button></div>`, true);
    d.querySelector('#yes').onclick = () => { S = fresh(); save(); go({ scr: 'intro' }); };
    d.querySelector('#no').onclick = closeSheet;
  };
}

/* ---------------- start ---------------- */
function boot() {
  if (!S.name || !S.sex) { S.cur = { scr: 'intro' }; return render(); }
  const c = S.cur || { scr: 'map' };
  if (c.scr === 'quiz' || c.scr === 'learn') {
    const s = stById(c.sid);
    if (!s) { S.cur = { scr: 'map' }; return render(); }
    S.lv = s.lv;
    const r = roundOf(c.sid);
    const where = c.scr === 'quiz' && r ? `pytanie ${Math.min(r.i + (r.solved ? 2 : 1), r.ids.length)} z ${r.ids.length}` : 'karty „Poznaj”';
    S.cur = { scr: 'map' }; render();
    const d = sheet('neu', `<h3>Witaj z powrotem, ${nm()}! 👋</h3><div class="fact">${spk('sm')}<span>${g('Skończyłeś', 'Skończyłaś')} tutaj: ${s.icon} ${esc(s.name)}${s.lv > 1 ? ` (poziom ${s.lv})` : ''}, ${where}.</span></div>
      <div class="list"><button class="big" id="cont">▶ Graj dalej</button><button class="big alt" id="tomap">🗺️ Mapa</button></div>`, true);
    bindSpeak(d, `Witaj z powrotem, ${S.name}! ${g('Skończyłeś', 'Skończyłaś')} tutaj: ${s.name}.`);
    d.querySelector('#cont').onclick = () => go(c);
    d.querySelector('#tomap').onclick = () => { closeSheet(); save(); };
    return;
  }
  if (c.scr === 'end' || c.scr === 'parent' || c.scr === 'diploma') S.cur = { scr: 'map' };
  if (!S.fins) S.fins = {};
  if (!S.lv || !lvUnlocked(S.lv)) S.lv = 1;
  render();
  if (S.cur.scr === 'map' && S.stars > 0) toast(`Witaj z powrotem, ${S.name}! 👋`);
}
window.__T = { get S() { return S; }, get Q() { return Q; }, go, QMAP, STATIONS, LEVELS, stById, mastered, kk, reset() { S = fresh(); save(); } };
boot();

</script>
